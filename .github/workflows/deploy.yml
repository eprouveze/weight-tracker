# deploy.yml — Build on GitHub-hosted Linux, deploy to Vercel. Public repo: never a self-hosted runner
# (a fork PR supplies its own workflow file and would run it on our host). Hosted minutes are free for public repos.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install dependencies
        run: npm ci

      - name: Vercel CLI (pinned)
        run: |
          D="$RUNNER_TOOL_CACHE/vercel-cli-63"
          [ -x "$D/bin/vercel" ] || npm install -g --prefix "$D" --no-fund --no-audit vercel@63 >/dev/null
          echo "$D/bin" >> "$GITHUB_PATH"
          "$D/bin/vercel" --version

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Cleanup build artifacts
        if: always()
        run: rm -rf .next .vercel/output
